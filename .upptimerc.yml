# Uptime checks for Ashutosh's deployed apps (run by GitHub Actions every 5 minutes; nothing to host).
# valor reads history/summary.json for Telegram alerts (2+ failed checks in a row) and the morning digest;
# ashutoshsao.com/status draws 90-day bars from the same file. Deep /health checks are added as each one deploys.
owner: ashutoshsao
repo: status

sites:
  - name: Portfolio
    url: https://ashutoshsao.com
  - name: Nebula
    url: https://nebula.ashutoshsao.com
  - name: Nebula WebSocket
    url: https://ws.nebula.ashutoshsao.com
    expectedStatusCodes: [426] # "upgrade required": the WebSocket server is alive
  - name: Nebula API
    url: https://api.nebula.ashutoshsao.com/health # 503 unless database, Redis and the engine answer
  - name: Orin
    url: https://orin.ashutoshsao.com
  - name: Orin API
    url: https://api.orin.ashutoshsao.com/health # 503 unless Postgres and Redis answer
  - name: Ardin
    url: https://ardin.ashutoshsao.com/signin
  - name: Proxy
    url: https://agent-dating-assignment.vercel.app/api/health

status-website:
  baseUrl: /status
  name: Ashutosh Sao — status
  introTitle: "Status of my deployed apps"
  introMessage: Checked every 5 minutes by GitHub Actions. The main view lives at [ashutoshsao.com/status](https://ashutoshsao.com/status).
  navbar:
    - title: Status
      href: /
    - title: Portfolio
      href: https://ashutoshsao.com
